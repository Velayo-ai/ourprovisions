<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- viewport-fit=cover (2026-10-16): without it iOS reports every env(safe-area-inset-*) as 0 while a
         home-screen (standalone) launch still draws the status bar over the page, so nothing could pad
         for the clock. With it the real insets arrive; the app applies them ONLY in standalone (the
         --op-inset-* variables under @media (display-mode: standalone)), so a Safari tab is unchanged. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- Standalone status bar: "default" asks iOS for an opaque, light status bar with dark text that the
         page lays out BELOW. Where iOS honours it, nothing can scroll under the clock and the insets are 0;
         where it does not (manifest-only installs on some versions overlay the bar), the cream .safe-top
         band plus the inset-padded header do the same job. Either way the clock stays black on cream. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="A smarter grocery list for your household. Live Better. Live Smarter." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ourprovisions.velayo.ai/" />
    <meta property="og:title" content="OurProvisions" />
    <meta property="og:description" content="A smarter grocery list for your household. Live Better. Live Smarter." />
    <meta property="og:image" content="https://ourprovisions.velayo.ai/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ourprovisions.velayo.ai/" />
    <meta name="twitter:title" content="OurProvisions" />
    <meta name="twitter:description" content="A smarter grocery list for your household. Live Better. Live Smarter." />
    <meta name="twitter:image" content="https://ourprovisions.velayo.ai/og-image.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>OurProvisions — the household list that gets smarter</title>
    <!-- Splash horizon arc — preload so the approved raster is ready for the cold-start resolve. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/splash_arc.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
