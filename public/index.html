<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- viewport-fit=cover (2026-10-16): without it iOS reports every env(safe-area-inset-*) as 0 while a
         home-screen (standalone) launch still draws the status bar over the page, so nothing could pad
         for the clock. With it the real insets arrive; the app applies them ONLY in standalone (the
         --op-inset-* variables under @media (display-mode: standalone)), so a Safari tab is unchanged. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- The header's dark (--op-header-dark in App.js; manifest.json theme_color is the same literal). Was CRA's
         #000000 default until 2026-11-12. -->
    <meta name="theme-color" content="#1a0e06" />
    <!-- Standalone status bar: "black-translucent" (2026-11-12) — a WHITE clock and battery, and the page laid out
         from the very top of the screen, UNDER the bar; env(safe-area-inset-top) is then the bar's height. Measured
         on iOS 27 with the old "default": env 0 and the page 62px BELOW the bar — iOS owns that strip, paints it
         light and fades its blur over the header, so nothing the page drew could darken it. With the page under
         the bar the strip is ours: #op-status-strip below paints it the header's dark, and the app keeps its content
         out from under it (--op-under-bar in App.js).
         Reverses the 2026-10-16/17 "default: black clock on a cream band" decision. iOS reads this tag when the
         icon is added to the Home Screen; an icon added earlier keeps the old chrome and the app still handles it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The status bar's region in an installed app is the header's dark (the same literal as theme-color above
         and --op-header-dark in App.js), from the first paint — before React — on every tab:
         1. the canvas: html is dark, and body is dark with its cream laid over everything BELOW the bar, so
            whatever iOS samples for its top blur (the root / body background colour) is the dark, not cream.
            (2026-11-12, fresh install: the page ran under the bar and a dark pseudo-element on body covered it, yet iOS
            drew a grey haze there — it was tinting from the cream body, not from what was painted.)
         2. #op-status-strip: a REAL fixed element pinned at top: 0 (iOS 26+ takes the top edge's colour from a
            fixed element there; a pseudo-element with pointer-events: none was not picked up), above every
            sheet, modal and full-screen surface.
         0 tall in a browser tab, on desktop and sideways (the inset is 0 there). -->
    <style>
      #op-status-strip { display: none; }
      @media (display-mode: standalone) {
        html { background-color: #1a0e06; }
        html body { background: linear-gradient(#FAF4EC, #FAF4EC) 0 env(safe-area-inset-top, 0px) / 100% 100% no-repeat #1a0e06; }
        #op-status-strip { display: block; position: fixed; top: 0; left: 0; right: 0; height: env(safe-area-inset-top, 0px);
                           background-color: #1a0e06; z-index: 5000; }
      }
    </style>
    <meta name="description" content="A smarter grocery list for your household. Live Better. Live Smarter." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ourprovisions.velayo.ai/" />
    <meta property="og:title" content="OurProvisions" />
    <meta property="og:description" content="A smarter grocery list for your household. Live Better. Live Smarter." />
    <meta property="og:image" content="https://ourprovisions.velayo.ai/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ourprovisions.velayo.ai/" />
    <meta name="twitter:title" content="OurProvisions" />
    <meta name="twitter:description" content="A smarter grocery list for your household. Live Better. Live Smarter." />
    <meta name="twitter:image" content="https://ourprovisions.velayo.ai/og-image.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>OurProvisions — the household list that gets smarter</title>
    <!-- Splash horizon arc — preload so the approved raster is ready for the cold-start resolve. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/splash_arc.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="op-status-strip" aria-hidden="true"></div>
    <div id="root"></div>
