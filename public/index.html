<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- viewport-fit=cover (2026-10-16): without it iOS reports every env(safe-area-inset-*) as 0 while a
         home-screen (standalone) launch still draws the status bar over the page, so nothing could pad
         for the clock. With it the real insets arrive; the app applies them ONLY in standalone (the
         --op-inset-* variables under @media (display-mode: standalone)), so a Safari tab is unchanged. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- The header's dark (--op-header-dark in App.js; manifest.json theme_color is the same literal). Was CRA's
         #000000 default until 2026-11-12. -->
    <meta name="theme-color" content="#1a0e06" />
    <!-- No status-bar-style meta tag (2026-11-12, dev trial 4): iOS's own default for a home-screen app, an
         opaque bar the page lays out BELOW. On fresh iOS 27 installs both "black-translucent" and "black" put the
         page BEHIND the bar, under iOS's top blur. Prod carried "default" (the same behaviour as no tag) when the
         phone measured the page starting 62px below the bar. iOS reads this when the icon is added. -->
    <!-- Colour-extension strip (the div is the first thing in <body>): a fixed element at the very top of the page
         whose background-color iOS samples to tint the status bar's region, so the strip behind the clock is the
         header's dark (the same literal as theme-color above and --op-header-dark in App.js). background-clip:
         text leaves it with nothing to paint, so it draws no band of its own. Installed app only; hidden on a
         sideways phone (the same query as Landscape = Staples). -->
    <style>
      .ios-status-strip { display: none; }
      @media (display-mode: standalone) {
        .ios-status-strip { display: block; position: fixed; inset: 0 0 auto; height: 11px; pointer-events: none;
                            background-color: #1a0e06; -webkit-background-clip: text; background-clip: text; }
      }
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) {
        .ios-status-strip { display: none; }
      }
    </style>
    <meta name="description" content="A smarter grocery list for your household. Live Better. Live Smarter." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ourprovisions.velayo.ai/" />
    <meta property="og:title" content="OurProvisions" />
    <meta property="og:description" content="A smarter grocery list for your household. Live Better. Live Smarter." />
    <meta property="og:image" content="https://ourprovisions.velayo.ai/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ourprovisions.velayo.ai/" />
    <meta name="twitter:title" content="OurProvisions" />
    <meta name="twitter:description" content="A smarter grocery list for your household. Live Better. Live Smarter." />
    <meta name="twitter:image" content="https://ourprovisions.velayo.ai/og-image.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>OurProvisions — the household list that gets smarter</title>
    <!-- Splash horizon arc — preload so the approved raster is ready for the cold-start resolve. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/splash_arc.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="ios-status-strip" aria-hidden="true"></div>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
