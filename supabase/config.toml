# supabase/config.toml — OurProvisions
#
# First introduced 2026-09-01 alongside the project's first Edge Function.
# This repo does NOT use the Supabase CLI for migrations: those are applied by hand
# in the SQL editor and committed under `migrations/` (see migrations/README.md, and
# note there is no schema_migrations ledger on either database). This file exists for
# Edge Function config only. Do not add a [db] section and do not run `supabase db
# push` against dev or prod — it would fight the hand-applied migration history.

project_id = "ourprovisions"

[functions.meal-suggestion]
# ⚠️ FALSE ON PURPOSE — corrected 2026-09-01 after testing, do not flip it back.
#
# The app's Clerk tokens are RS256, signed by Clerk (iss: <instance>.clerk.accounts.dev).
# Postgres accepts them via Supabase third-party auth, but the Edge Functions gateway
# does NOT: it rejected a live, unexpired token with UNAUTHORIZED_ASYMMETRIC_JWT, with
# 9 seconds still on the clock. Leaving verify_jwt = true makes this function
# unreachable by every real user, which is exactly what the first deploy did.
#
# The function verifies the token ITSELF instead — full RS256 signature check against
# the issuer's JWKS, pinned algorithm, issuer allowlist (see verifyCaller in index.ts).
# That is strictly MORE verification than the platform gate performed, not less.
verify_jwt = false
